[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-arm-api"
version = "0.1.0"
description = "Safe Lite6 robot arm API for the formulation cell"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML==6.0.3",
  "xarm-python-sdk==1.17.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

